name: repeat release gate

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact lowercase 40-character candidate commit SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: repeat-release-${{ inputs.release_sha }}
  cancel-in-progress: false

jobs:
  verify-three-times:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CALLBOARD_RELEASE_SHA: ${{ inputs.release_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install browser used by each isolated attempt
        run: npx --yes playwright@1.62.1 install --with-deps chromium

      - name: Verify exact SHA in three disposable checkouts
        run: node scripts/repeat-release-verify.mjs

      - name: Upload machine-readable release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # The untrusted dispatch input never controls an artifact filesystem path.
          name: repeat-release-${{ github.run_id }}
          path: artifacts/release-gate/
          if-no-files-found: error
          retention-days: 14
